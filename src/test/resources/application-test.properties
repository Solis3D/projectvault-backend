# TEST DATABASE
spring.datasource.url=jdbc:h2:mem:projectvault-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# TEST MAIL
mail.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@projectvault.local
spring.mail.password=test

# TEST JWT
jwt.secret=projectvault-test-secret-key-at-least-32-characters-long
jwt.expiration=86400000

# TEST CLOUDINARY
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

# TEST INITIAL ADMIN
admin.first-name=Test
admin.last-name=Admin
admin.username=test-admin
admin.email=test-admin@projectvault.local
admin.password=TestPassword123!

# TEST CORS AND FRONTEND
cors.allowed-origins=http://localhost:5173
frontend.url=http://localhost:5173